name: JiitSphere CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            backend-

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run ESLint
        working-directory: ./backend
        run: npx eslint src/

      - name: Run Prettier check
        working-directory: ./backend
        run: npx prettier --check src/

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: frontend-${{ hashFiles('web/package-lock.json') }}
          restore-keys: |
            frontend-

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run ESLint
        working-directory: ./web
        run: npx eslint src/

      - name: Run Prettier check
        working-directory: ./web
        run: npx prettier --check src/

      - name: Run Next.js Lint
        working-directory: ./web
        run: npx next lint

  test-backend:
    name: Test Backend
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache backend node_modules
        uses: actions/cache@v4
        with:
          path: backend/node_modules
          key: backend-${{ hashFiles('backend/package-lock.json') }}

      - name: Install Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: ./backend
        run: npm test -- --ci --coverage

      - name: Check Coverage Threshold
        working-directory: ./backend
        # Enforce 80% coverage check
        run: npx jest --ci --coverage --coverageThreshold='{"global":{"lines":80}}'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./backend/coverage
          flags: backend

  test-frontend:
    name: Test Frontend
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache frontend node_modules
        uses: actions/cache@v4
        with:
          path: web/node_modules
          key: frontend-${{ hashFiles('web/package-lock.json') }}

      - name: Install Dependencies
        working-directory: ./web
        run: npm ci

      - name: Run Tests with Coverage
        working-directory: ./web
        run: npm test -- --ci --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          directory: ./web/coverage
          flags: frontend

  build-check:
    name: Build & Load Check
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: Next.js Build
        working-directory: ./web
        run: npm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Check Express App Loads
        working-directory: ./backend
        # Verify that the backend app loads and compiles without immediately crashing
        run: node -e "require('./src/app')"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: NPM Audit Backend
        working-directory: ./backend
        # Using || true so the pipeline doesn't break entirely if a high vulnerability exists initially,
        # adjust based on strictness requirements.
        run: npm audit --audit-level=high || true

      - name: NPM Audit Frontend
        working-directory: ./web
        run: npm audit --audit-level=high || true

      - name: Install Secretlint
        run: npm install -g secretlint @secretlint/secretlint-rule-preset-recommend

      - name: Check for hardcoded secrets
        run: |
          echo '{"rules": {"@secretlint/secretlint-rule-preset-recommend": true}}' > .secretlintrc.json
          npx secretlint "**/*"

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
