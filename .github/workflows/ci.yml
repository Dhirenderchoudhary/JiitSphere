name: JiitSphere CI/CD Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./backend
        run: pnpm exec eslint src/

      - name: Run Prettier check
        working-directory: ./backend
        run: pnpm exec prettier --check src/

  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        working-directory: ./web
        run: pnpm exec eslint src/

      - name: Run Prettier check
        working-directory: ./web
        run: pnpm exec prettier --check src/

      - name: Run ESLint
        working-directory: ./web
        run: pnpm exec eslint src/

  test-backend:
    name: Test Backend
    needs: [lint-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Run Tests with Coverage
        working-directory: ./backend
        run: pnpm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./backend/coverage
          flags: backend
          token: 48f50eb7-142f-4b95-8647-8463e3a20579

  test-frontend:
    name: Test Frontend
    needs: [lint-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Run Tests with Coverage
        working-directory: ./web
        run: pnpm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          directory: ./web/coverage
          flags: frontend
          token: 48f50eb7-142f-4b95-8647-8463e3a20579

  build-check:
    name: Build & Load Check
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: pnpm install --frozen-lockfile

      - name: Next.js Build
        working-directory: ./web
        run: pnpm run build

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Check Express App Loads
        working-directory: ./backend
        env:
          MONGODB_URI: "mongodb://localhost:27017/dummy"
        run: node -e "require('./src/app')"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Audit Backend
        working-directory: ./backend
        run: pnpm audit --audit-level=high || true

      - name: Audit Frontend
        working-directory: ./web
        run: pnpm audit --audit-level=high || true

      - name: Install Secretlint
        run: npm install -g secretlint @secretlint/secretlint-rule-preset-recommend

      - name: Check for hardcoded secrets
        run: |
          echo '{"rules": {"@secretlint/secretlint-rule-preset-recommend": true}}' > .secretlintrc.json
          npx secretlint "**/*" --ignore-pattern "**/node_modules/**" --ignore-pattern "node_modules/**" --ignore-pattern ".git/**" || true

      - name: Run Snyk
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
